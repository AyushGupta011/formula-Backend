services:
  mysql:
    image: mysql:8.0
    container_name: formula_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: formula_engine
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/view_aggregate.sql:/docker-entrypoint-initdb.d/02_view.sql

volumes:
  mysql_data:
